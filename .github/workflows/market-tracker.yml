name: Market Tracker

on:
  schedule:
    - cron: "7 3 * * *" # 03:07 UTC daily
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install -r app/requirements.txt
          pip install awscli==1.34.14

      - name: Run tracker
        env:
          OUTPUT_PATH: ./data/market_tracker.csv
          CONFIG_PATH: ./app/config.json
          DAYS_CRYPTO: 365
          DAYS_EQUITY: 400d
          EXPORT_SERIES: "true"
          SERIES_DIR: ./data
        run: |
          mkdir -p data
          python app/market_tracker.py
          tail -n +2 data/market_tracker.csv | wc -l

      - name: Commit CSV back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market_tracker.csv
          git commit -m "update market_tracker.csv [skip ci]" || echo "No changes"
          git push

      - name: Configure AWS (optional)
        if: ${{ secrets.AWS_ACCESS_KEY_ID && secrets.AWS_SECRET_ACCESS_KEY && secrets.S3_BUCKET }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Upload to S3 (optional)
        if: ${{ secrets.AWS_ACCESS_KEY_ID && secrets.AWS_SECRET_ACCESS_KEY && secrets.S3_BUCKET }}
        run: |
          aws s3 cp data/market_tracker.csv "s3://${{ secrets.S3_BUCKET }}/market_tracker.csv"
