name: Market Tracker

on:
  schedule:
    - cron: "0 0 * * 1-5"
  workflow_dispatch:
  pull_request:
    paths:
      - "app/**"
      - "tests/**"
      - "scripts/**"
      - "site/**"
      - ".github/workflows/market-tracker.yml"
      - "pyproject.toml"

# Prevent overlapping scheduled runs from racing on the data/ outputs.
concurrency:
  group: market-tracker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            app/requirements.txt
            app/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install -r app/requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run test suite
        env:
          PYTHONPATH: app
        run: pytest

  run-pipeline:
    name: Run market tracker pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: lint-and-test
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            app/requirements.txt
            app/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run tracker
        env:
          OUTPUT_PATH: ./data/market_tracker.csv
          OUTPUT_JSON_PATH: ./data/copilot_signals.json
          OUTPUT_LATEST_PATH: ./data/latest_signals.json
          CONFIG_PATH: ./app/config.json
          SYMBOLS_PATH: ./app/symbols.json
          DAYS_CRYPTO: "730"
          DAYS_EQUITY: 800d
          OUTPUT_MODE: historical
          WRITE_MODE: replace
          EXPORT_SERIES: "false"
          EXPORT_JSON: "true"
          SERIES_DIR: ./data
          TRACK_CRYPTO: major,defi,layer1,layer2,infrastructure,meme
          TRACK_STOCKS: tech_mega_caps,enterprise_software,semiconductors,finance,healthcare,energy,consumer,industrial,staples,communications,materials_mining
          TRACK_INDICES: "true"
          LOG_LEVEL: INFO
        run: |
          mkdir -p data
          python app/market_tracker.py
          test -s data/market_tracker.csv
          test -s data/copilot_signals.json
          test -s data/latest_signals.json
          python -c "import json; p=json.load(open('data/copilot_signals.json')); print('signals', len(p.get('signals',[])))"

      - name: Run backtest
        env:
          CSV_PATH: ./data/market_tracker.csv
          CONFIG_PATH: ./app/config.json
          OUT_DIR: ./data
          MIN_BACKTEST_BARS: "252"
        run: |
          python app/backtest.py --mode summary
          test -s data/backtest_summary.csv

      - name: Run threshold sweep
        env:
          CSV_PATH: ./data/market_tracker.csv
          CONFIG_PATH: ./app/config.json
          OUT_DIR: ./data
          MIN_BACKTEST_BARS: "252"
        run: python app/backtest.py --mode sweep --min 15 --max 50 --step 5

      - name: Generate report
        env:
          OUT_DIR: ./data
          MARKET_CSV: ./data/market_tracker.csv
          REPORT_PATH: ./data/backtest_report.md
        run: |
          python app/report.py
          test -s data/backtest_report.md

      - name: Upload generated outputs
        uses: actions/upload-artifact@v4
        with:
          name: market-tracker-output
          path: data/
          if-no-files-found: error
          retention-days: 30

  distribute:
    name: Slack, Pages, and public JSON
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: run-pipeline
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download pipeline outputs
        uses: actions/download-artifact@v4
        with:
          name: market-tracker-output
          path: data

      - name: Post summary to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DATA_DIR: data
        run: python scripts/slack_notify.py

      - name: Build GitHub Pages bundle
        run: |
          mkdir -p site-dist
          cp site/index.html site-dist/
          cp data/latest_signals.json data/copilot_signals.json data/backtest_report.md site-dist/
          echo "Published at $(date -u +%Y-%m-%dT%H:%M:%SZ)" > site-dist/build.txt

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site-dist
          keep_files: false
