name: Market Tracker

on:
  schedule:
    - cron: "7 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "app/**"
      - "tests/**"
      - ".github/workflows/market-tracker.yml"
      - "pyproject.toml"

# Prevent overlapping scheduled runs from racing on the data/ outputs.
concurrency:
  group: market-tracker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            app/requirements.txt
            app/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install -r app/requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run test suite
        env:
          PYTHONPATH: app
        run: pytest

  run-pipeline:
    name: Run market tracker pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint-and-test
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            app/requirements.txt
            app/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run tracker
        env:
          OUTPUT_PATH: ./data/market_tracker.csv
          CONFIG_PATH: ./app/config.json
          SYMBOLS_PATH: ./app/symbols.json
          DAYS_CRYPTO: "365"
          DAYS_EQUITY: 400d
          OUTPUT_MODE: historical
          WRITE_MODE: replace
          EXPORT_SERIES: "true"
          SERIES_DIR: ./data
          TRACK_CRYPTO: major,defi
          TRACK_STOCKS: tech_mega_caps,semiconductors
          TRACK_INDICES: "true"
          LOG_LEVEL: INFO
        run: |
          mkdir -p data
          python app/market_tracker.py
          test -s data/market_tracker.csv
          tail -n +2 data/market_tracker.csv | wc -l

      - name: Run backtest
        env:
          CSV_PATH: ./data/market_tracker.csv
          CONFIG_PATH: ./app/config.json
          OUT_DIR: ./data
          MIN_BACKTEST_BARS: "252"
        run: |
          python app/backtest.py --mode summary
          test -s data/backtest_summary.csv

      - name: Run threshold sweep
        env:
          CSV_PATH: ./data/market_tracker.csv
          CONFIG_PATH: ./app/config.json
          OUT_DIR: ./data
          MIN_BACKTEST_BARS: "252"
        run: python app/backtest.py --mode sweep --min 15 --max 50 --step 5

      - name: Generate report
        env:
          OUT_DIR: ./data
          MARKET_CSV: ./data/market_tracker.csv
          REPORT_PATH: ./data/backtest_report.md
        run: |
          python app/report.py
          test -s data/backtest_report.md

      - name: Upload generated outputs
        uses: actions/upload-artifact@v4
        with:
          name: market-tracker-output
          path: data/
          if-no-files-found: error
          retention-days: 30

      # Optional S3 upload. Uncomment after adding AWS_ACCESS_KEY_ID,
      # AWS_SECRET_ACCESS_KEY, AWS_REGION, and S3_BUCKET repository secrets.
      # - name: Configure AWS credentials
      #   uses: aws-actions/configure-aws-credentials@v4
