services:
  tracker:
    build: .
    image: market-tracker:latest
    container_name: market-tracker
    environment:
      OUTPUT_PATH: /data/market_tracker.csv
      OUTPUT_JSON_PATH: /data/copilot_signals.json
      OUTPUT_LATEST_PATH: /data/latest_signals.json
      CONFIG_PATH: /app/config.json
      SYMBOLS_PATH: /app/symbols.json
      DAYS_CRYPTO: "730"
      DAYS_EQUITY: 800d
      OUTPUT_MODE: historical
      WRITE_MODE: replace
      EXPORT_SERIES: "true"
      EXPORT_JSON: "true"
      SERIES_DIR: /data
      TRACK_CRYPTO: major,defi
      TRACK_STOCKS: tech_mega_caps,semiconductors
      TRACK_INDICES: "true"
      LOG_LEVEL: INFO
    volumes:
      - ./data:/data
    restart: "no"
    command: ["python", "/app/market_tracker.py"]

  backtest:
    image: market-tracker:latest
    container_name: market-backtest
    environment:
      CSV_PATH: /data/market_tracker.csv
      CONFIG_PATH: /app/config.json
      OUT_DIR: /data
      MIN_BACKTEST_BARS: "252"
    volumes:
      - ./data:/data
    depends_on:
      - tracker
    restart: "no"
    command: ["python", "/app/backtest.py", "--mode", "summary"]

  sweep:
    image: market-tracker:latest
    container_name: market-sweep
    environment:
      CSV_PATH: /data/market_tracker.csv
      CONFIG_PATH: /app/config.json
      OUT_DIR: /data
      MIN_BACKTEST_BARS: "252"
    volumes:
      - ./data:/data
    depends_on:
      - tracker
    restart: "no"
    command: ["python", "/app/backtest.py", "--mode", "sweep", "--min", "15", "--max", "50", "--step", "5"]

  report:
    image: market-tracker:latest
    container_name: market-report
    environment:
      OUT_DIR: /data
      REPORT_PATH: /data/backtest_report.md
      MARKET_CSV: /data/market_tracker.csv
    volumes:
      - ./data:/data
    depends_on:
      - backtest
      - sweep
    restart: "no"
    command: ["python", "/app/report.py"]

  test:
    build: .
    image: market-tracker:latest
    container_name: market-test
    working_dir: /workspace
    environment:
      PYTHONPATH: /workspace/app
    volumes:
      - ./tests:/workspace/tests:ro
      - ./app:/workspace/app:ro
      - ./pyproject.toml:/workspace/pyproject.toml:ro
    restart: "no"
    command: ["python", "-m", "pytest", "/workspace/tests", "-v"]
