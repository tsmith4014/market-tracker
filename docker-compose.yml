version: "3.9"

services:
  tracker:
    build: .
    image: market-tracker:latest
    container_name: market-tracker
    environment:
      - OUTPUT_PATH=/data/market_tracker.csv
      - CONFIG_PATH=/app/config.json
      - DAYS_CRYPTO=365
      - DAYS_EQUITY=400d
      - EXPORT_SERIES=true
      - SERIES_DIR=/data
    volumes:
      - ./data:/data
    restart: "no"
    command: ["python", "/app/market_tracker.py"]

  backtest:
    image: market-tracker:latest
    container_name: market-backtest
    environment:
      - CSV_PATH=/data/market_tracker.csv
      - CONFIG_PATH=/app/config.json
      - OUT_DIR=/data
    volumes:
      - ./data:/data
    depends_on:
      - tracker
    restart: "no"
    command: ["python", "/app/backtest.py", "--mode", "summary"]

  sweep:
    image: market-tracker:latest
    container_name: market-sweep
    environment:
      - CSV_PATH=/data/market_tracker.csv
      - CONFIG_PATH=/app/config.json
      - OUT_DIR=/data
    volumes:
      - ./data:/data
    depends_on:
      - tracker
    restart: "no"
    command:
      [
        "python",
        "/app/backtest.py",
        "--mode",
        "sweep",
        "--min",
        "15",
        "--max",
        "50",
        "--step",
        "5",
      ]

  report:
    image: market-tracker:latest
    container_name: market-report
    environment:
      - OUT_DIR=/data
      - REPORT_PATH=/data/backtest_report.md
    volumes:
      - ./data:/data
    depends_on:
      - backtest
      - sweep
    restart: "no"
    command: ["python", "/app/report.py"]
